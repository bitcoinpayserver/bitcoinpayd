[package]
name = "bitcoinpayd"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["fs"]}
tokio-postgres = { version = "0.7.18",features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgresql_embedded = "0.21.0"
deadpool-postgres = "0.14.2"
uuid = { version = "1.26.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.151"
rust_decimal = { version = "1.43.0", features = ["db-tokio-postgres"] }
bitcoin = "0.32.102"
serde = { version = "1.0.229", features = ["derive"] }
html-escape = "0.2.15"
qrcode = "0.14.1"
bip321 = "0.4.0"
base64 = "0.23.1"
futures = "0.3.34"
reqwest = "0.13.5"

[build-dependencies]
tonic-prost-build = "0.14.6"
